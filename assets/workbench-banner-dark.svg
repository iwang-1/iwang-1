<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="A row of mechanical keyboard keycaps spelling IVAN with an orange return key, beside the line: I build software the way I build keyboards — carefully, end to end.">
  <!-- dark warm desk-mat card -->
  <rect x="0.5" y="0.5" width="1199" height="239" rx="14" fill="#26201A" stroke="#3B332A"/>

  <!-- bench edge: one hairline the caps rest on, shared with the text column -->
  <line x1="48" y1="167.5" x2="1152" y2="167.5" stroke="#453B30"/>

  <!-- keycap row: I V A N + one accent return cap (paper caps on a dark mat) -->
  <g>
    <!-- I -->
    <rect x="56" y="73" width="94" height="94" rx="10" fill="#C9C1B4"/>
    <rect x="56" y="66" width="94" height="94" rx="10" fill="#FAF7F2" stroke="#E7E0D6" stroke-width="2"/>
    <text x="103" y="129" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#201B16">I</text>
    <!-- V -->
    <rect x="166" y="73" width="94" height="94" rx="10" fill="#C9C1B4"/>
    <rect x="166" y="66" width="94" height="94" rx="10" fill="#FAF7F2" stroke="#E7E0D6" stroke-width="2"/>
    <text x="213" y="129" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#201B16">V</text>
    <!-- A -->
    <rect x="276" y="73" width="94" height="94" rx="10" fill="#C9C1B4"/>
    <rect x="276" y="66" width="94" height="94" rx="10" fill="#FAF7F2" stroke="#E7E0D6" stroke-width="2"/>
    <text x="323" y="129" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#201B16">A</text>
    <!-- N -->
    <rect x="386" y="73" width="94" height="94" rx="10" fill="#C9C1B4"/>
    <rect x="386" y="66" width="94" height="94" rx="10" fill="#FAF7F2" stroke="#E7E0D6" stroke-width="2"/>
    <text x="433" y="129" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#201B16">N</text>
    <!-- the ONE accent cap: return key -->
    <rect x="496" y="73" width="94" height="94" rx="10" fill="#9A3412"/>
    <rect x="496" y="66" width="94" height="94" rx="10" fill="#C2410C" stroke="#9A3412" stroke-width="2"/>
    <g transform="translate(543,113)" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17,-16 V7 H-15"/>
      <path d="M-6,-3 L-16,7 L-6,17"/>
    </g>
  </g>

  <!-- hero line, split at its natural cadence -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#FAF7F2">
    <text x="668" y="82">I build software</text>
    <text x="668" y="118">the way I build keyboards &#8212;</text>
    <text x="668" y="154" font-style="italic">carefully, end to end.</text>
  </g>

  <!-- mono meta under the bench edge -->
  <text x="57" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#B3A896">keyboards &#183; pc builds &#183; climbing</text>
  <text x="1151" y="198" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#B3A896">iwang-1.github.io</text>
</svg>
